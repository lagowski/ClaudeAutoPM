# Scoped Dependabot auto-merge (lagowski/pr-review-gate#1 hardening — routine deps
# shouldn't need a human, but the dangerous ones still must).
#
# Auto-merges ONLY: npm ecosystem, semver patch/minor. It approves + enables auto-merge,
# so GitHub still holds the PR until required checks pass (the copilot-review gate + CI)
# — auto-merge is "the gate is the reviewer," not "no checks."
#
# Deliberately NEVER auto-merged (left for a human):
#   - github-actions ecosystem  → those edit .github/workflows/** (CODEOWNERS-locked) and
#     are infra-critical, e.g. the gate's own actions/github-script (a node24 major bump).
#   - any semver-major           → breaking-change risk.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # Grouped-aware gate. `fetch-metadata`'s top-level `package-ecosystem` /
      # `update-type` outputs are populated only for single-dep PRs; grouped
      # PRs (dependabot's *-minor-patch groups) leave those empty and put every
      # updated dependency under `updated-dependencies-json` — a JSON array of
      # {packageEcosystem, updateType, dependencyName, ...}. The previous
      # single-dep-only gate therefore skipped every grouped PR (see #689/#690).
      # New rule: approve iff EVERY entry is npm AND NONE is semver-major.
      # `github_actions` is excluded implicitly (not npm); majors are held.
      # The ecosystem string is fetch-metadata's verbatim `npm_and_yarn` — NOT
      # `npm`. Comparing against `npm` made `allNpm` false for every npm PR, so
      # nothing was ever approved and the job stayed green while doing nothing
      # (#773/#774 sat blocked on an approval that never came). Locked in by
      # test/unit/dependabot-auto-merge-gate.test.js.
      - name: Decide auto-merge (grouped-aware)
        id: gate
        uses: actions/github-script@v9
        env:
          UPDATES: ${{ steps.meta.outputs.updated-dependencies-json }}
        with:
          script: |
            const updates = JSON.parse(process.env.UPDATES || '[]');
            if (updates.length === 0) {
              core.setOutput('approve', 'false');
              core.info('No updates in metadata; nothing to gate.');
              return;
            }
            const allNpm = updates.every(u => u.packageEcosystem === 'npm_and_yarn');
            const anyMajor = updates.some(u => u.updateType === 'version-update:semver-major');
            const approve = allNpm && !anyMajor;
            core.setOutput('approve', String(approve));
            core.info(
              `Gate: approve=${approve} (deps=${updates.length}, allNpm=${allNpm}, anyMajor=${anyMajor})`
            );
            for (const u of updates) {
              core.info(`  - ${u.dependencyName} (${u.packageEcosystem}, ${u.updateType})`);
            }

      - name: Approve + enable auto-merge
        if: steps.gate.outputs.approve == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
