# AI review gate for a PUBLIC repo (owner 2026-11-04). Rendered by
# lagowski/pr-review-gate (deploy/render.js) from templates/review-engine-public.yml plus the
# jobs of .github/workflows/fleet-review-engine.yml, with this repo's identity filled in. Do not
# hand-edit it here; drift-check compares it byte-for-byte.
#
# A public repo cannot call the private canon's reusable workflow (GitHub refuses it, gate#339),
# so the engine's jobs are inlined here, and they are the SAME jobs every private repo runs.
#
# Why this is safe on a public repo:
#   * pull_request_target runs THIS file as it is on the base branch. A fork PR cannot change it.
#   * Nothing from the PR is checked out. The engine reads the diff through the API. The only
#     checkout is the canon engine at a pinned 40-hex SHA.
#   * The reviewer CLI starts with no tools and no MCP servers (the engine refuses otherwise,
#     #700/#721), so text in a PR can sway a verdict but cannot run anything.
#   * The review runners are in workflow-restricted groups that allow only this file at the
#     branches below (deploy/runner-group-sync.js). A fork's pull_request workflow runs at
#     refs/pull/N/merge and cannot land on them.
#   * FORK_POLICY=label: a fork-head PR is reviewed only after a maintainer adds the
#     `safe-to-review` label (then by the next sweep, or by "Run workflow" here).
#     pull_request_target ignores GitHub's fork-approval setting, so the label is the approval gate.

name: AI Review Gate (Claude Sonnet 4.6)

on:
  pull_request_target:
    # ONLY the events that bring a commit, as in the private caller: a second run on one commit
    # strands the check (#580), and the engine's stranded detector would then tell the PR author
    # to push a fresh head. So `labeled`, `ready_for_review` and `reopened` are NOT here. A fork PR
    # that a maintainer labels `safe-to-review` is reviewed by the next sweep, or at once by
    # "Run workflow" on this file (workflow_dispatch reviews every open PR the policy allows).
    types: [opened, synchronize]
    branches: ["develop","main"]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.event.pull_request.number && format('copilot-review-{0}', github.event.pull_request.number) || 'copilot-review-cron' }}
  # A fresh push cancels the review of the old head, as in the private caller; nothing else does.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && github.event.action == 'synchronize' }}

permissions:
  pull-requests: write
  checks: write
  contents: read
  actions: write

jobs:
  scope:
    if: >-
      false
      || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.count.outputs.has_work }}
    steps:
      - if: false
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha
              || context.payload.merge_group?.head_sha;
            if (!sha) {
              core.info('review paused, and this event carries no head to report on');
              return;
            }
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: ${{ toJSON('copilot-review') }}, head_sha: sha,
              status: 'completed', conclusion: 'success',
              output: {
                title: 'Review paused for this repository',
                summary: [
                  '<!-- gate-status: reason=repo_paused retryable=false conclusion=success -->',
                  '',
                  'This repository is paused in the canon registry, so no review ran.',
                  '',
                  'The check is posted as a PASS on purpose: it is required, and a required',
                  'check that stops appearing does not pause a repo — it makes every pull',
                  'request in it unmergeable forever.',
                  '',
                  'Unpause it in `registry/repos.yml` (`review_paused`) to bring reviews back.',
                ].join('\n'),
              },
            });
            core.info('review paused — check posted, nothing sent to the review pool');
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: count
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 1,
            });
            const has = prs.data.length > 0;
            core.info(has
              ? 'open pull requests exist — handing over to the review pool'
              : 'no open pull requests — the review pool is not needed for this sweep');
            core.setOutput('has_work', has ? 'true' : 'false');

  review:
    needs: [scope]
    if: >-
      always() && !false
      && (needs.scope.result != 'success'
          || needs.scope.outputs.has_work == 'true')
    runs-on: ${{ fromJSON('["self-hosted","claude-bridge"]') }}
    timeout-minutes: ${{ fromJSON('30') }}
    env:
      FALLBACK_ONLY: ${{ vars.CLAUDE_BRIDGE_FALLBACK_ONLY || 'true' }}
      COPILOT_REVIEW_STALE_MIN: ${{ vars.COPILOT_REVIEW_STALE_MIN || '60' }}
      CHECK_NAME: ${{ 'copilot-review' }}
      MARKER_PREFIX: ${{ 'gemini-ai-review' }}
      VERDICT_PREFIX: ${{ 'gemini-verdict' }}
      TRUNCATED_PREFIX: ${{ 'gemini-truncated' }}
      BACKEND: ${{ 'claude-bridge' }}
      REVIEW_MODEL: ${{ 'claude-sonnet-4-6' }}
      DISPLAY_NAME: ${{ 'Claude Sonnet 4.6' }}
      MAX_DIFF_CHARS: ${{ '200000' }}
      PER_CALL_TIMEOUT_MS: ${{ '600000' }}
      JOB_TIMEOUT_MIN: ${{ '30' }}
      FORK_POLICY: ${{ 'label' }}
      MODE_RULES: ${{ '{"everyday":"single-call","promotion":null}' }}
      ADVISORY_SCOPES: ${{ '[]' }}
      COUNCIL_SPECIALISTS: ${{ '[]' }}
      OPENROUTER_API_KEY: ''
      REVIEW_EFFORT: medium
      ENGINE_JS: ${{ github.workspace }}/_engine/.github/scripts/review-engine.js
      ENGINE_REF: ${{ '310b0bee144ddb1f3cea250131082b66550f0201' }}
    steps:
      - name: load the engine source at the pinned commit
        id: engine_src
        if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
        continue-on-error: true   # a failed checkout must fail CLOSED at the loader, never wedge the job
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: lagowski/pr-review-gate
          ref: ${{ '310b0bee144ddb1f3cea250131082b66550f0201' }}
          token: ${{ secrets.FLEET_DEPLOY_TOKEN }}
          path: _engine
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENGINE_SRC_OUTCOME: ${{ steps.engine_src.outcome }}
          DEPENDABOT_PR_RUN: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
        with:
          script: |
            // #252 Item 1: the engine JS lives in a checked-out FILE (see the checkout step above),
            // NOT inline — an inline body is passed as INPUT_SCRIPT and crosses MAX_ARG_STRLEN
            // (128 KiB), which E2BIG'd every review fleet-wide on 2026-08-25. This tiny loader is
            // the ONLY thing still passed as INPUT_SCRIPT. It preserves github-script's exact
            // bindings and async semantics: the body runs as an AsyncFunction whose positional
            // params ARE the injected globals (github/context/core/exec/glob/io/fetch/require),
            // forwarded verbatim, so the moved file behaves byte-identically to the old inline body.
            const fs = require('fs');
            const p = process.env.ENGINE_JS;
            const sha = context.payload.pull_request?.head?.sha
              || context.payload.merge_group?.head_sha;
            if (process.env.DEPENDABOT_PR_RUN === 'true') {
              // OWNER 2026-10-23: every review goes through claude-bridge, nothing else. A run
              // Dependabot triggered receives no Actions secrets, so it can neither load the engine
              // nor reach any model. It reviews NOTHING and says so, FAIL-CLOSED (`failure`, never
              // `neutral`: a neutral required check is satisfied, #343). No bot review carries a
              // verdict marker for this sha, so the scheduled sweep (Actions secrets, the claude-
              // bridge runner) reviews it from scratch on its next tick, as it does for any crash.
              // Before this, ClaudeAutoPM#803 went red with "OPENROUTER_API_KEY not set".
              if (sha) {
                await github.rest.checks.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name: process.env.CHECK_NAME, head_sha: sha,
                  status: 'completed', conclusion: 'failure',
                  output: {
                    title: 'Queued for the scheduled review sweep (Dependabot run)',
                    summary: '<!-- gate-status: reason=dependabot_deferred retryable=true conclusion=failure -->\n'
                      + 'GitHub gives a run that Dependabot triggered no Actions secrets, so this run did not review '
                      + 'anything. A sweep run of this workflow was dispatched now and reviews this exact commit '
                      + '(if that dispatch failed, the scheduled sweep does it on its next tick) and replaces this '
                      + 'check. No action is needed; do NOT close/reopen or push to get a fresh run.',
                  },
                });
              }
              // The */5 cron is throttled to one run every 1-5 h in this org (ClaudeAutoPM: 21:22,
              // 00:02, 04:38, 09:33Z on 2026-10-22/23), so waiting for it parks a Dependabot PR for
              // hours. Dispatch the CALLER on the default branch now, as the multi-pass engine does
              // for its next pass: workflow_dispatch is the one GITHUB_TOKEN event that starts a run,
              // and that run's actor is github-actions[bot], not Dependabot, so it gets Actions
              // secrets. Best effort: if it fails, the scheduled sweep still owns the commit.
              try {
                const m = String(process.env.GITHUB_WORKFLOW_REF || '').match(/\/(\.github\/workflows\/[^@]+)@/);
                if (!m) throw new Error('GITHUB_WORKFLOW_REF unreadable');
                const { owner, repo } = context.repo;
                const { data: info } = await github.rest.repos.get({ owner, repo });
                await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: m[1].split('/').pop(), ref: info.default_branch });
                core.notice(`Dependabot-triggered run: no review here; dispatched a sweep (${m[1]} on ${info.default_branch}).`);
              } catch (e) {
                core.warning(`Dependabot-triggered run: sweep dispatch failed (${e && e.message}) — the scheduled sweep will review this commit.`);
              }
              return;
            }
            if (process.env.ENGINE_SRC_OUTCOME !== 'success' || !p || !fs.existsSync(p)) {
              // FAIL CLOSED, LOUDLY (#200/#358): the engine could not load, so nothing was reviewed.
              // An ABSENT required check wedges every PR forever, so post one that SAYS it failed,
              // then fail the job. Never a silent pass on a load failure.
              if (sha) {
                try {
                  await github.rest.checks.create({
                    owner: context.repo.owner, repo: context.repo.repo,
                    name: process.env.CHECK_NAME, head_sha: sha,
                    status: 'completed', conclusion: 'failure',
                    output: {
                      title: 'Review engine failed to load',
                      summary: '<!-- gate-status: reason=engine_load_failed retryable=true conclusion=failure -->\n'
                        + 'The engine source could not be fetched at the pinned commit, so no review ran. '
                        + 'This is fail-closed (never a silent pass). Check CANON_READ_TOKEN and actions/checkout.',
                    },
                  });
                } catch (e) { core.error('engine_load_failed and could not post the check: ' + (e && e.message)); }
              }
              core.setFailed(`engine source not loaded at ${p || '(unset ENGINE_JS)'} — checkout of the canon `
                + `at the pinned SHA failed (CANON_READ_TOKEN missing/insufficient, or checkout unavailable)`);
              return;
            }
            const body = fs.readFileSync(p, 'utf8');
            // #721 ISOLATION FLOOR: engine_ref is the CALLER's input, so a branch cut before a resync
            // hands this loader an engine older than #700, which reviews with the account's claude.ai
            // connectors and tools on offer (cuentas#462 on sprint/sprint-11, pin 3462118). Run only
            // an engine whose code refuses an unisolated CLI; anything else fails closed and says how.
            const code = body.split('\n').filter((l) => !l.trim().startsWith('//')).join('\n');   // code, not the comments about it
            if (!code.includes("ENABLE_CLAUDEAI_MCP_SERVERS: 'false'")
              || !code.includes("if (iso.missing.length) { resolve({ status: 'runner_unhealthy' }); return; }")) {
              const why = `engine_ref ${process.env.ENGINE_REF || '?'} predates the mandatory reviewer isolation (#700/#721)`;
              if (sha) {
                try {
                  await github.rest.checks.create({
                    owner: context.repo.owner, repo: context.repo.repo,
                    name: process.env.CHECK_NAME, head_sha: sha,
                    status: 'completed', conclusion: 'failure',
                    output: {
                      title: 'Review engine too old to run isolated',
                      summary: '<!-- gate-status: reason=engine_too_old retryable=false conclusion=failure -->\n'
                        + `${why}, so no review ran (fail-closed). This branch's caller workflow pins an old gate: `
                        + 'merge the default branch into this PR\'s base (and then into this branch) to pick up the current pin.',
                    },
                  });
                } catch (e) { core.error('engine_too_old and could not post the check: ' + (e && e.message)); }
              }
              core.setFailed(why);
              return;
            }
            const AsyncFunction = Object.getPrototypeOf(async () => {}).constructor;
            const fn = new AsyncFunction(
              'require', '__original_require__', 'core', 'exec', 'glob', 'io', 'fetch', 'github', 'context', body);
            return await fn(require, __original_require__, core, exec, glob, io, fetch, github, context);
